<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数智选材 原型</title>
<style>
:root{
  --paper:#f6f3ec; --card:#fffdf8; --ink:#1d1c1a; --ink2:#5b5850; --ink3:#8d887c; --rule:#d9d3c5;
  --accent:#e0a100; --accent-ink:#5a4100; --ok:#2f7d4f; --warn:#b5531c; --dot:#b9b2a2; --front:#1d1c1a;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#171614; --card:#201f1c; --ink:#ece7dc; --ink2:#b5ae9f; --ink3:#857f72; --rule:#3a3730;
  --accent:#f0b51e; --accent-ink:#f6d27a; --ok:#6cc08f; --warn:#e88a55; --dot:#5c574d; --front:#ece7dc; } }
:root[data-theme="dark"]{ --paper:#171614; --card:#201f1c; --ink:#ece7dc; --ink2:#b5ae9f; --ink3:#857f72; --rule:#3a3730;
  --accent:#f0b51e; --accent-ink:#f6d27a; --ok:#6cc08f; --warn:#e88a55; --dot:#5c574d; --front:#ece7dc; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;padding:18px 24px 10px;border-bottom:2px solid var(--ink)}
header h1{font-size:20px;margin:0;letter-spacing:.06em}
header .sub{color:var(--ink2);font-size:13px}
header .tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.wrap{display:grid;grid-template-columns:320px 1fr;gap:0;min-height:calc(100vh - 60px)}
aside{border-right:1px solid var(--rule);padding:16px 18px;background:var(--card)}
main{padding:16px 24px 48px;min-width:0}
h2{font-size:13px;letter-spacing:.12em;color:var(--ink2);margin:22px 0 8px;font-weight:600;border-bottom:1px solid var(--rule);padding-bottom:4px;display:flex;gap:8px;align-items:baseline}
h2 .n{font-family:var(--mono);color:var(--accent-ink);background:var(--accent);color:#1d1c1a;padding:0 6px;border-radius:2px;font-size:12px}
h2 .hint{margin-left:auto;font-weight:400;letter-spacing:0;color:var(--ink3);font-size:12px}
label{display:block;font-size:12px;color:var(--ink2);margin:10px 0 3px}
select,input[type=number],input[type=text]{width:100%;padding:6px 8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:3px;font:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dis{display:grid;grid-template-columns:1fr 92px;gap:4px 8px;align-items:center;font-size:13px}
.dis select{padding:3px 6px}
button{font:inherit;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:7px 14px;border-radius:3px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.run{width:100%;margin-top:16px;padding:10px}
.casepick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.casepick button{background:transparent;color:var(--ink);border-color:var(--rule);padding:3px 8px;font-size:12px}
.casepick button.on{border-color:var(--ink);background:var(--accent);color:#1d1c1a}
.bg{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.5}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;padding:14px 16px;background:var(--card);border:1px solid var(--rule);border-left:6px solid var(--accent)}
.verdict .big{font-size:22px;font-weight:700;line-height:1.3;grid-column:1/-1}
.verdict .k{color:var(--ink3);font-size:12px}
.verdict .v{font-family:var(--mono)}
.kpis{display:flex;flex-wrap:wrap;gap:0;margin-top:10px;border:1px solid var(--rule);background:var(--card)}
.kpi{padding:8px 14px;border-right:1px solid var(--rule);min-width:120px}
.kpi:last-child{border-right:0}
.kpi .k{font-size:11px;color:var(--ink3)}
.kpi .v{font-family:var(--mono);font-size:18px}
.kpi .v small{font-size:11px;color:var(--ink3)}
table{border-collapse:collapse;width:100%;background:var(--card);font-size:13px}
th,td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:12px;background:var(--paper)}
td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
td.why{color:var(--ink2);font-size:12px}
.tag{display:inline-block;font-size:11px;padding:0 5px;border:1px solid var(--rule);border-radius:2px;color:var(--ink2);margin-right:2px}
.tag.std{border-color:var(--ink3)}
.tag.scene{border-color:var(--accent);color:var(--accent-ink)}
.bar{position:relative;height:14px;background:var(--paper);border:1px solid var(--rule);min-width:120px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bar i.low{background:var(--warn)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
.chartbox{background:var(--card);border:1px solid var(--rule);padding:8px;position:relative}
svg text{fill:var(--ink2);font-size:11px;font-family:var(--mono)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 8px;border-radius:3px;max-width:320px;display:none;z-index:2}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin:6px 2px 0;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px;border-radius:50%}
.legend .l1::before{background:var(--dot)} .legend .l2::before{background:var(--front)} .legend .l3::before{background:var(--accent);border-radius:0;transform:rotate(45deg)} .legend .l4::before{border:2px solid var(--warn);background:transparent;border-radius:0}
.formula{font-family:var(--mono);font-size:13px;background:var(--card);border:1px dashed var(--ink3);padding:10px 12px;line-height:1.8}
.formula b{font-family:-apple-system,"PingFang SC",sans-serif;font-weight:600;color:var(--ink2);display:inline-block;min-width:76px;font-size:12px}
.note{font-size:12px;color:var(--ink3)}
.cf td:first-child{max-width:330px}
.pos{color:var(--ok)} .neg{color:var(--warn)}
.pill{font-size:11px;padding:1px 6px;border-radius:9px;background:var(--paper);border:1px solid var(--rule)}
.pill.ok{border-color:var(--ok);color:var(--ok)} .pill.no{border-color:var(--warn);color:var(--warn)}
.fb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:end;background:var(--card);border:1px solid var(--rule);padding:10px}
.empty{color:var(--ink3);padding:30px;text-align:center;border:1px dashed var(--rule)}
footer{color:var(--ink3);font-size:11px;padding:8px 24px;border-top:1px solid var(--rule)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tabs button{background:transparent;color:var(--ink);border-color:var(--rule);padding:3px 8px;font-size:12px}
.tabs button[aria-pressed=true]{background:var(--accent);border-color:var(--ink);color:#1d1c1a}
.contrib{display:grid;grid-template-columns:minmax(110px,1.1fr) minmax(120px,3fr) minmax(86px,.9fr);gap:5px 10px;align-items:center;font-size:12px;background:var(--card);border:1px solid var(--rule);padding:10px}
.cbar{position:relative;height:14px}
.cbar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink3)}
.cbar i{position:absolute;top:2px;bottom:2px}
.cbar i.p{background:var(--ok)} .cbar i.n{background:var(--warn)}
.rlegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:6px}
.rlegend span::before{content:"";display:inline-block;width:14px;height:0;border-top:3px solid var(--sw);margin-right:5px;vertical-align:3px}
.rlegend span.dash::before{border-top-style:dashed}
details.gnode{background:var(--card);border:1px solid var(--rule);padding:6px 10px;margin-top:6px;font-size:12px}
details.gnode summary{cursor:pointer;color:var(--ink2)}
.sr{position:absolute;left:-9999px}
@media print{aside,.tools,.run,.fb,.tabs,footer,.casepick{display:none!important} .wrap{display:block} aside+main{padding:0}}
@media (max-width:900px){table{display:block;overflow-x:auto} .wrap{grid-template-columns:1fr} aside{border-right:0;border-bottom:1px solid var(--rule)} .grid2{grid-template-columns:1fr} .fb{grid-template-columns:1fr 1fr} main{padding:12px 16px 40px} header{padding:14px 16px 8px}}
</style>
</head>
<body>
<header>
  <h1>数智选材</h1>
  <span class="sub">养护场景 → 性能需求包络 → 达标可靠度选材 · 演示原型 v2.0</span>
  <span class="tools"><button class="ghost" id="exportBtn" type="button" title="把当前输入和结果保存为 JSON 文件" disabled>导出 JSON</button><button class="ghost" id="themeBtn" type="button" title="切换明暗">明/暗</button></span>
</header>
<div class="wrap">
<aside>
  <h2><span class="n">01</span>场景输入</h2>
  <div class="note">载入典型案例，或直接修改参数：</div>
  <div class="casepick" id="casePick"></div>
  <div class="bg" id="caseBg"></div>
  <label for="city">所在城市（气候数据）</label><select id="city"></select>
  <div class="row2">
    <div><label for="roadClass">道路等级</label><select id="roadClass"><option value="highway">高速/一级</option><option value="arterial">城市主干/快速路</option><option value="local">次干/支路</option></select></div>
    <div><label for="treatment">养护工法</label><select id="treatment"></select></div>
  </div>
  <div class="row2">
    <div><label for="traffic">交通荷载等级</label><select id="traffic"></select></div>
    <div><label for="speed">车速/渠化</label><select id="speed"></select></div>
  </div>
  <label for="aggregate">粗集料</label><select id="aggregate"></select>
  <label>病害与严重程度</label>
  <div class="dis" id="disBox"></div>
  <div class="row2">
    <div><label for="ambientT">施工期气温 °C</label><input type="number" id="ambientT" step="1"></div>
    <div><label for="haulMin">运输时间 min</label><input type="number" id="haulMin" step="5"></div>
  </div>
  <div class="row2">
    <div><label for="targetRel">目标可靠度</label><input type="number" id="targetRel" step="0.05" min="0.5" max="0.99" placeholder="按等级缺省"></div>
    <div><label for="budget">造价上限 元/m²</label><input type="number" id="budget" step="1" placeholder="不限"></div>
  </div>
  <div class="row2">
    <div><label for="carbonCap">年均碳排上限 kgCO₂e/m²·年</label><input type="number" id="carbonCap" step="0.05" min="0" placeholder="不限"></div>
    <div><label for="samples">抽样次数</label><select id="samples"><option value="200">200（快）</option><option value="400" selected>400（默认）</option><option value="1000">1000</option><option value="2000">2000（慢）</option></select></div>
  </div>
  <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="nightWork"> 夜间封道施工</label>
  <label style="display:flex;gap:6px;align-items:flex-start" title="按成本从低到高，在独立噪声上复算接近目标的候选，取第一个通过者；缺省按 v1 在同一批抽样上选优"><input type="checkbox" id="selMode" style="margin-top:3px"> <span>稳健选优：在独立噪声上复算候选，减少“挑中运气好的方案”</span></label>
  <div id="crackBox" style="display:none"><label for="crackW">裂缝宽度 mm</label><input type="number" id="crackW" value="8"></div>
  <button class="run" id="runBtn" type="button">生成材料方案</button>
  <div class="note" style="margin-top:10px">引擎在本地浏览器运行，不联网。每个候选方案按所选次数做蒙特卡洛抽样（公共随机数）；结论另用独立种子复验。</div>
</aside>
<main id="out" aria-live="polite"><div class="empty">在左侧选择案例或输入场景后点击“生成材料方案”。</div></main>
</div>
<footer>构造案例与演示先验。模型内通过比例不代表工程成功概率，寿命、费用与碳排均为假设测算；规则须按原始条文和企业试验逐项复核。</footer>

<script>/*
 * 数智选材 · 场景—材料结构化知识库 (Knowledge Base)
 *
 * 取值分三类，每条都带 src 字段说明来源层级：
 *   STD  —— 按现行行业规范整理的门槛值（JTG F40—2004 等），提交前应按最新版本逐条核对；
 *   LIT  —— 依据公开文献的典型趋势设定的先验值，用于演示，需企业数据标定；
 *   ENG  —— 本作品设定的工程参数（企业可调），属于方法的一部分而非事实陈述。
 * 城市气候数据为公开气象资料的近似值，仅用于演示，正式应用应替换为气象站 30 年序列。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.SZXC_KB = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const meta = {
    version: '1.0.0',
    updated: '2026-10-21',
    note: '演示版知识库；STD 门槛需按现行规范核对，LIT/ENG 参数需企业数据标定',
  };

  // ---------- 1. 气候：城市样本（近似值，src: LIT） ----------
  // julyAvgMax: 最热月平均最高气温; t7max: 年最热连续7天平均最高气温; extremeMin: 极端最低气温;
  // rain: 年降水量 mm; sd: 年际标准差 (°C)
  const cities = [
    { id: 'yangpu',   name: '海南洋浦', lat: 19.7, julyAvgMax: 33.0, t7max: 35.0, t7maxSd: 1.0, extremeMin: 6.0,   tminSd: 2.0, rain: 1100 },
    { id: 'haikou',   name: '海口',     lat: 20.0, julyAvgMax: 33.2, t7max: 35.3, t7maxSd: 1.0, extremeMin: 4.9,   tminSd: 2.0, rain: 1680 },
    { id: 'guangzhou',name: '广州',     lat: 23.1, julyAvgMax: 33.0, t7max: 35.5, t7maxSd: 1.1, extremeMin: 0.0,   tminSd: 2.2, rain: 1720 },
    { id: 'chongqing',name: '重庆',     lat: 29.6, julyAvgMax: 34.5, t7max: 38.3, t7maxSd: 1.4, extremeMin: -1.8,  tminSd: 1.8, rain: 1100 },
    { id: 'wuhan',    name: '武汉',     lat: 30.6, julyAvgMax: 33.0, t7max: 37.0, t7maxSd: 1.3, extremeMin: -18.1, tminSd: 3.5, rain: 1260 },
    { id: 'nanjing',  name: '南京',     lat: 32.0, julyAvgMax: 32.3, t7max: 36.5, t7maxSd: 1.3, extremeMin: -14.0, tminSd: 3.0, rain: 1100 },
    { id: 'xian',     name: '西安',     lat: 34.3, julyAvgMax: 32.5, t7max: 37.5, t7maxSd: 1.5, extremeMin: -20.6, tminSd: 3.2, rain: 580 },
    { id: 'beijing',  name: '北京',     lat: 39.9, julyAvgMax: 31.0, t7max: 35.5, t7maxSd: 1.5, extremeMin: -27.4, tminSd: 3.5, rain: 550 },
    { id: 'lanzhou',  name: '兰州',     lat: 36.1, julyAvgMax: 29.5, t7max: 33.0, t7maxSd: 1.4, extremeMin: -23.1, tminSd: 3.0, rain: 310 },
    { id: 'lhasa',    name: '拉萨',     lat: 29.6, julyAvgMax: 23.0, t7max: 26.5, t7maxSd: 1.0, extremeMin: -16.5, tminSd: 2.5, rain: 450 },
    { id: 'kunming',  name: '昆明',     lat: 25.0, julyAvgMax: 24.5, t7max: 27.5, t7maxSd: 1.0, extremeMin: -7.8,  tminSd: 2.0, rain: 1000 },
    { id: 'urumqi',   name: '乌鲁木齐', lat: 43.8, julyAvgMax: 31.0, t7max: 35.0, t7maxSd: 1.5, extremeMin: -41.5, tminSd: 4.0, rain: 290 },
    { id: 'harbin',   name: '哈尔滨',   lat: 45.8, julyAvgMax: 28.0, t7max: 31.5, t7maxSd: 1.3, extremeMin: -38.1, tminSd: 3.5, rain: 530 },
  ];

  // ---------- 2. 沥青路面使用性能气候分区（src: STD, JTG F40 附录 A 三级指标） ----------
  const climateZoning = {
    src: 'STD',
    ref: 'JTG F40—2004 附录A 沥青路面使用性能气候分区',
    high: [ { max: Infinity, min: 30, code: 1, name: '夏炎热区' }, { max: 30, min: 20, code: 2, name: '夏热区' }, { max: 20, min: -Infinity, code: 3, name: '夏凉区' } ],
    low:  [ { lt: -37.0, code: 1, name: '冬严寒区' }, { lt: -21.5, code: 2, name: '冬寒区' }, { lt: -9.0, code: 3, name: '冬冷区' }, { lt: Infinity, code: 4, name: '冬温区' } ],
    rain: [ { gt: 1000, code: 1, name: '潮湿区' }, { gt: 500, code: 2, name: '湿润区' }, { gt: 250, code: 3, name: '半干区' }, { gt: -Infinity, code: 4, name: '干旱区' } ],
  };

  // ---------- 3. 合规底线（src: STD, JTG F40—2004 表5.3.3 系列整理值，提交前核对现行版） ----------
  const standards = {
    ref: 'JTG F40—2004 第5.3.3条 沥青混合料技术要求（整理值）',
    // 车辙试验动稳定度 (次/mm)，键为 高温区-低温区 组合
    dsDense: {
      ordinary: { '1-1': 800, '1-2': 800, '1-3': 1000, '1-4': 1000, '2-1': 600, '2-2': 800, '2-3': 800, '2-4': 800, '3': 600 },
      modified: { '1-1': 2400, '1-2': 2400, '1-3': 2800, '1-4': 2800, '2-1': 2000, '2-2': 2400, '2-3': 2400, '2-4': 2400, '3': 1800 },
    },
    dsSMA: { ordinary: 1500, modified: 3000 },
    dsOGFC: { normal: 1500, heavy: 3000 },
    // 低温弯曲试验破坏应变 (με)，按低温区
    strain: { ordinary: { 1: 2600, 2: 2300, 3: 2000, 4: 2000 }, modified: { 1: 3000, 2: 2800, 3: 2500, 4: 2500 } },
    // 浸水马歇尔残留稳定度 (%)，按年降水 ≥500 / <500
    ms0: { wet: { ordinary: 80, modified: 85 }, dry: { ordinary: 75, modified: 80 }, sma: { ordinary: 75, modified: 80 } },
    // 冻融劈裂强度比 TSR (%)
    tsr: { wet: { ordinary: 75, modified: 80 }, dry: { ordinary: 70, modified: 75 }, sma: { ordinary: 75, modified: 80 } },
  };

  // ---------- 4. 交通荷载等级与场景增强系数（src: ENG，等级划分参照 JTG D50—2017） ----------
  const traffic = {
    levels: [
      { id: 'light',  name: '轻',   esal: '<4×10^6',      dsFactor: null, fatigueTarget: 4.5, pgBump: 0 },
      { id: 'medium', name: '中等', esal: '4–8×10^6',     dsFactor: null, fatigueTarget: 4.8, pgBump: 0 },
      { id: 'heavy',  name: '重',   esal: '8–19×10^6',    dsFactor: 1.0,  fatigueTarget: 5.1, pgBump: 0 },
      { id: 'vheavy', name: '特重', esal: '19–100×10^6',  dsFactor: 1.2,  fatigueTarget: 5.3, pgBump: 1 },
      { id: 'xheavy', name: '极重', esal: '>100×10^6',    dsFactor: 1.4,  fatigueTarget: 5.5, pgBump: 1 },
    ],
    // 车速：Superpave 加级思路（AASHTO M323 的慢速 +1 级、停滞 +2 级）
    speed: [
      { id: 'normal',   name: '正常行驶 (>70 km/h)', pgBump: 0, dsFactor: 1.0 },
      { id: 'slow',     name: '慢速 (20–70 km/h)',   pgBump: 1, dsFactor: 1.15 },
      { id: 'standing', name: '停滞/渠化 (<20 km/h)',pgBump: 2, dsFactor: 1.3 },
    ],
    src: 'ENG',
    note: '轻/中等交通的 DS 目标取规范普通沥青值×1.0/1.5；重及以上取改性沥青值×dsFactor',
  };

  // ---------- 5. 病害与养护工法（src: ENG，工法名称对应 JTG 5142—2019 养护工程分类） ----------
  const distresses = [

  // ---------- 6. 预测（机理先验） ----------
  function biasOf(state, cand, ind) {

  // ---------- 7. 工艺扰动：压实欠缺 → 空隙率增量 ----------

  // ---------- 8. 蒙特卡洛评估 ----------

  // ---------- 9. 选优、Pareto、解释 ----------
  function pareto(rows) {

  // ---------- 9b. 候选重建、独立种子复验、Shapley 归因、雷达数据 ----------

      const v = evaluate(scn, clim, tgt, r.cand, noise, opts);
      if (v.reliability >= T) return { pick: r, reached: true, tested };
      if (!best || v.reliability > best.rel + 1e-12 || (Math.abs(v.reliability - best.rel) <= 1e-12 && r.euac < best.row.euac)) best = { row: r, rel: v.reliability };
    }
    return { pick: best.row, reached: false, tested };
  }

  // 精确 Shapley 归因（7 个组成维度，128 个联盟全枚举）。
  // 解释对象是本作品的机理先验预测式，而非训练得到的数据模型；参考配方为 AC-13 + 70# + 全部不加。
  // 联盟中的中间组合可能违反施工规则，仅用于计算贡献，不代表可实施方案。
  const REF_MIX = 'AC13/B70/none/none/none/R0/none';
  function shapley(cand) {
    const ref = buildCand(REF_MIX, cand.agg.id), n = DIMS.length, N = 1 << n;
    const mu = new Array(N);
    for (let m = 0; m < N; m++) {
      const c = Object.assign({}, ref);
      DIMS.forEach((d, i) => { if (m & (1 << i)) c[d] = cand[d]; });
      mu[m] = predictMean(c, null);
    }
    const fact = [1]; for (let i = 1; i <= n; i++) fact[i] = fact[i - 1] * i;
    const popcount = (m) => { let c = 0; while (m) { c += m & 1; m >>= 1; } return c; };
    const indicators = IND.map((k) => {
      const f = (m) => (k === 'ds' ? Math.log(mu[m].ds) : mu[m][k]);
      const phi = DIMS.map((d, i) => {
        let sum = 0;
        for (let m = 0; m < N; m++) {
          if (m & (1 << i)) continue;
          const sz = popcount(m);
          sum += (fact[sz] * fact[n - sz - 1] / fact[n]) * (f(m | (1 << i)) - f(m));
        }
        return sum;
      });
      const log = k === 'ds', dec = k === 'td' || k === 'fatigue' ? 3 : 2;
      return {
        ind: k, name: IND_NAME[k], unit: IND_UNIT[k], scale: log ? 'log' : 'linear',
        reference: round(mu[0][k], dec), predicted: round(mu[N - 1][k], dec),
        total: round(f(N - 1) - f(0), 4),
        contributions: DIMS.map((d, i) => ({
          dim: d, dimName: DIM_NAME[d], from: ref[d].name, to: cand[d].name,
          changed: ref[d].id !== cand[d].id, value: round(phi[i], 4), factor: log ? round(Math.exp(phi[i]), 3) : null,
        })).filter((c) => c.changed || Math.abs(c.value) > 1e-9).map((c) => { delete c.changed; return c; })
          .sort((a, b) => Math.abs(b.value) - Math.abs(a.value)),
      };
    });
    return {
      method: '精确 Shapley 值（全联盟枚举）', target: '机理先验预测式（不含反馈偏差修正）',
      reference: { id: REF_MIX, label: describe({ cand: ref }) },
      note: '动稳定度在对数空间归因，factor 为乘性影响；其余指标为加性影响。联盟内中间组合可能违反施工规则，仅用于计算贡献。',
      indicators,
    };
  }

  // 多维对比（雷达图）：各轴取 0–1，越大越好。归一化范围为“满足全部约束后的候选集”，只在同一场景内可比。
  const RADAR_AXES = [
    { id: 'reliability', name: '联合可靠度' }, { id: 'weakest', name: '短板指标达标率' }, { id: 'life', name: '估计寿命' },
    { id: 'economy', name: '年值经济性' }, { id: 'carbon', name: '低碳' }, { id: 'workability', name: '施工容错' },
  ];
  function radarOf(plans, pool, scn, clim, noise, opts) {
    const span = (f) => { const v = pool.map(f); return [Math.min(...v), Math.max(...v)]; };
    const [l0, l1] = span((r) => r.lifeMean), [e0, e1] = span((r) => r.euac), [c0, c1] = span((r) => r.carbonYr);
    const norm = (x, a, b, inv) => (b - a < 1e-9 ? 1 : clamp(inv ? (b - x) / (b - a) : (x - a) / (b - a), 0, 1));
    const seen = new Set(), series = [];
    for (const { role, row } of plans) {
      if (seen.has(row.id)) continue; seen.add(row.id);
      const rb = processAdvice(scn, clim, row, noise, opts).robustness;
      series.push({
        id: row.id, label: describe(row), role,
        values: [row.reliability, row.passRate[row.bottleneck], norm(row.lifeMean, l0, l1), norm(row.euac, e0, e1, true), norm(row.carbonYr, c0, c1, true), clamp(1 + Math.min(rb.colder8, rb.va1), 0, 1)].map((x) => round(x, 3)),
      });
    }
    return {
      axes: RADAR_AXES,
      note: '寿命、年值、碳排按当前约束后候选集的最小—最大范围归一化；施工容错=1+min(施工气温降8°C后可靠度变化, 空隙率偏大1%后可靠度变化)，下限 0。',
      series,
    };
  }

  // ---------- 10. 基准方法（用于对比） ----------
  function experienceBaseline(scn, clim) {
    const thin = treatmentOf(scn).thicknessCm <= 2.5;
    const heavy = ['vheavy', 'xheavy'].includes(scn.traffic) || scn.speed === 'standing';
    const cold = clim.zone.low.code <= 2, hot = clim.zone.high.code === 1;
    // 经验选型：重载/停滞 → SMA；抗滑不足 → SMA；严寒/寒区 → 软基质 SBS；炎热或重交通 → 70# 基 SBS；
    //         酸性石料或水损害 → 抗剥落剂；温缩裂缝严重 → 提高 SBS 剂量
    const has = (id) => scn.distresses.some((d) => d.id === id);
    let g = thin ? 'AC10' : 'AC13', b = 'B70', f = 'none';
    const cold1 = clim.zone.low.code === 1;
    if (heavy || has('skid')) { g = thin ? 'SMA10' : 'SMA13'; f = 'lignin'; b = cold1 ? 'SBS110_5' : cold ? 'SBS90_4' : 'SBS70_4'; }
    else if (cold) b = cold1 ? 'SBS110_5' : 'SBS90_4';
    else if (hot || ['heavy'].includes(scn.traffic)) b = 'SBS70_4';
    if (has('thermalCrack') && b === 'SBS90_4') b = 'SBS90_5';
    const agg = byId(KB.aggregates, scn.aggregate);
    const w = agg.acidic || has('moisture') ? 'amine' : 'none';
    return [g, b, w, 'none', 'none', 'R0', f].join('/');
  }
  function weightedSumPick(rows) {
    // 常见 AHP 式加权打分：各指标“均值/要求”截断后加权，减去成本项
    const W = { ds: 0.25, strain: 0.2, tsr: 0.2, fatigue: 0.15, td: 0.05 }, wc = 0.15;
    const cMin = Math.min(...rows.map((r) => r.costM2)), cMax = Math.max(...rows.map((r) => r.costM2));
    let best = null, bs = -Infinity;
    for (const r of rows) {
      let s = 0; for (const k in W) s += W[k] * Math.min(1.3, k === 'fatigue' ? Math.pow(10, r.mean[k] - r.req[k]) : r.mean[k] / r.req[k]);
      s -= wc * (r.costM2 - cMin) / (cMax - cMin || 1);
      if (s > bs) { bs = s; best = r; }
    }
    return best;
  }

  // ---------- 11. 主入口 ----------
  function recommend(input, opts) {
    opts = opts || {};
    const t0 = Date.now();
    const scn = normalizeScenario(input);
    for (const [key, values] of Object.entries({roadClass:['highway','arterial','local'], traffic:KB.traffic.levels.map(x=>x.id), speed:KB.traffic.speed.map(x=>x.id), aggregate:KB.aggregates.map(x=>x.id)})) {
      if (!values.includes(scn[key])) throw new Error('未知场景字段 ' + key);
    }
    if (!Number.isFinite(scn.ambientT) || !Number.isFinite(scn.haulMin) || scn.haulMin < 0) throw new Error('施工温度和运输时长须为有效数值，运输时长不可为负');
    if (scn.crackWidthMm != null && (!Number.isFinite(scn.crackWidthMm) || scn.crackWidthMm <= 0)) throw new Error('裂缝宽度须为正数');
    for (const d of scn.distresses) if (!KB.distresses.some(x=>x.id===d.id) || ![0,1,2].includes(d.severity)) throw new Error('病害编号或严重程度无效');
    if (scn.climate) {
      for (const k of ['lat','julyAvgMax','t7max','t7maxSd','extremeMin','tminSd','rain']) if (!Number.isFinite(scn.climate[k])) throw new Error('自定义气候字段无效：' + k);
      if (Math.abs(scn.climate.lat)>90 || ['rain','t7maxSd','tminSd'].some(k=>scn.climate[k]<0)) throw new Error('自定义气候超出有效范围');
    }
    if (!Number.isInteger(scn.samples) || scn.samples < 1 || scn.samples > 10000) throw new Error('采样数须为 1–10000 的整数');
    if (!Number.isFinite(scn.targetReliability) || scn.targetReliability <= 0 || scn.targetReliability > 1) throw new Error('目标可靠度须大于 0 且不超过 1');
    if (scn.budgetPerM2 != null && (!Number.isFinite(scn.budgetPerM2) || scn.budgetPerM2 < 0)) throw new Error('预算须为非负有限数值');
    if (scn.carbonCapYr != null && (!Number.isFinite(scn.carbonCapYr) || scn.carbonCapYr < 0)) throw new Error('年均碳排上限须为非负有限数值');
    if (!Number.isInteger(scn.seed)) throw new Error('随机种子须为整数');
    if (!['point', 'validated'].includes(scn.selection)) throw new Error('选优模式须为 point 或 validated');
    const trt = treatmentOf(scn);
    if (!trt) throw new Error('未知养护工法 ' + scn.treatment);
    const clim = climateOf(scn);
    if (!trt.mix) return crackRecommend(scn, clim);
    const tgt = sceneTargets(scn, clim);
    const { candidates, rejected } = enumerate(scn, clim);
    const noise = makeNoise(scn.samples, scn.seed);
    let rows = candidates.map((c) => evaluate(scn, clim, tgt, c, noise, opts));
    const nAll = rows.length;
    let budgetCut = 0, carbonCut = 0;
    if (scn.budgetPerM2 != null) { const keep = rows.filter((r) => r.costM2 <= scn.budgetPerM2); budgetCut = rows.length - keep.length; rows = keep; }
    if (scn.carbonCapYr != null) { const keep = rows.filter((r) => r.carbonYr <= scn.carbonCapYr); carbonCut = rows.length - keep.length; rows = keep; }
    if (!rows.length) return {
      engine: ENGINE_ID, module: 'infeasible', scenario: scn,
      targetReached: false, recommended: null, alternatives: [], pareto: [], cloud: [],
      reason: !nAll ? '当前施工条件下无可行方案，请调整施工气温、工法或材料条件。'
        : scn.carbonCapYr != null && scn.budgetPerM2 != null ? '预算与碳排约束内无可行方案，请放宽预算、碳排上限或调整养护工法。'
        : scn.carbonCapYr != null ? '碳排上限内无可行方案，请放宽上限或调整养护工法。'
        : '预算内无可行方案，请调整预算或养护工法。',
      stats: { feasible: nAll, budgetCut, carbonCut, rejected, samples: scn.samples },
    };
    const picked = scn.selection === 'validated' ? chooseValidated(rows, scn, clim, tgt, opts) : choose(rows, scn.targetReliability);
    const { pick, reached } = picked;
    const front = pareto(rows);
    const cheapest = rows.reduce((a, b) => (b.costM2 < a.costM2 ? b : a));
    const expId = experienceBaseline(scn, clim);
    const exp = rows.find((r) => r.id === expId) || evaluate(scn, clim, tgt, buildCand(expId, scn.aggregate), noise, opts);
    const ws = weightedSumPick(rows);
    const alts = front.filter((r) => r !== pick).sort((a, b) => Math.abs(a.euac - pick.euac) - Math.abs(b.euac - pick.euac)).slice(0, 4);
    const pg = { high: pgGradeHigh(clim.pavHigh98 + 6 * tgt.bump), low: pgGradeLow(clim.pavLow98 - tgt.pgLowExtra) };
    const recSummary = summarize(pick, true); recSummary.validation = validatePick(scn, clim, tgt, pick, opts);
    const expSummary = summarize(exp); expSummary.validation = validatePick(scn, clim, tgt, exp, opts);
    const radar = radarOf([{ role: 'recommended', row: pick }].concat(alts.map((r) => ({ role: 'alternative', row: r })), [{ role: 'experience', row: exp }]), rows, scn, clim, noise, opts);
    return {
      engine: ENGINE_ID, elapsedMs: Date.now() - t0, scenario: scn, tags: tagScenario(scn),
      climate: { city: clim.name, zone: clim.zone.code, zoneName: `${clim.zone.high.name}·${clim.zone.low.name}·${clim.zone.rain.name}`,
        pavHigh98: round(clim.pavHigh98, 1), pavLow98: round(clim.pavLow98, 1), pgRequired98: `PG ${pg.high}-${-pg.low}` },
      requirements: IND.map((k) => ({ ind: k, name: IND_NAME[k], unit: IND_UNIT[k], sceneTarget: k === 'pgHigh' ? round(clim.pavHighMean + 6 * tgt.bump, 1) : k === 'pgLow' ? round(clim.pavLowMean - tgt.pgLowExtra, 1) : round(tgt[k], 2), why: tgt.why[k] })),
      priorities: scarcity(rows),
      stats: { enumerated: nAll + Object.values(rejected).reduce((a, b) => a + b, 0), feasible: nAll, budgetCut, carbonCut, rejected, samples: scn.samples },
      targetReliability: scn.targetReliability, targetReached: reached,
      recommended: recSummary, process: processAdvice(scn, clim, pick, noise, opts),
      selection: { mode: scn.selection, validatedCandidates: picked.tested || 0, note: scn.selection === 'validated' ? '按成本升序在独立噪声上复算候选，取首个通过者；最终复验使用另一组独立噪声。' : '在同一批抽样上选优，recommended.validation 给出独立种子复验结果以揭示乐观偏差。' },
      explain: shapley(pick.cand), radar,
      counterfactuals: counterfactuals(pick, rows, scn.targetReliability).slice(0, 12),
      alternatives: alts.map((r) => summarize(r)),
      pareto: front.map((r) => summarize(r)),
      baselines: { experience: expSummary, weightedSum: summarize(ws), cheapest: summarize(cheapest) },
      cloud: rows.map((r) => [round(r.reliability, 3), round(r.euac, 2), round(r.carbonYr, 2), r.id]),
    };
  }
  function summarize(r, full) {
    const o = {
      id: r.id, label: describe(r), reliability: round(r.reliability, 3), reliabilityInterval95: r.reliabilityInterval95, samples: r.samples, passRate: Object.fromEntries(IND.map((k) => [k, round(r.passRate[k], 3)])),
      bottleneck: r.bottleneck, bottleneckName: IND_NAME[r.bottleneck], lifeMean: round(r.lifeMean, 1), lifeP10: round(r.lifeP10, 1),

    if (full) {
      o.formula = {
        gradation: r.cand.grad.name, binder: r.cand.binder.name, binderContent: r.cand.grad.pb, aggregate: r.cand.agg.name,
        water: r.cand.water.name, rut: r.cand.rut.name, warm: r.cand.warm.name, rap: r.cand.rap.name, fiber: r.cand.fiber.name,
        binderPG: `PG ${pgGradeHigh(r.cand.binder.trueHigh)}-${-pgGradeLow(r.cand.binder.trueLow)}`,
      };
      o.predicted = Object.fromEntries(IND.map((k) => [k, { mean: round(r.mean[k], k === 'td' ? 2 : k === 'fatigue' ? 2 : 1), req: k in r.req ? round(r.req[k], 2) : null, binding: r.binding[k] || 'scene' }]));
      o.costBreak = Object.fromEntries(Object.entries(r.costBreak).map(([k, v]) => [k, round(v, 1)]));
    }
    return o;
  }

  // ---------- 12. 裂缝处治模块 ----------
  function crackRecommend(scn, clim) {
    const w = scn.crackWidthMm || 6;
    const rule = KB.crackRules.find((r) => w <= r.maxWidth);
    const lowNeed = clim.pavLow98, highNeed = clim.pavHigh98 + 15; // 灌缝胶软化点需高于路表最高温约 15°C（ENG）
    const ok = KB.sealants.filter((s) => s.lowTest <= lowNeed && s.softening >= highNeed);
    const pick = (ok.length ? ok : KB.sealants.slice().sort((a, b) => a.lowTest - b.lowTest)).sort((a, b) => a.price - b.price)[0];
    return {
      engine: ENGINE_ID, module: 'crack', scenario: scn, tags: tagScenario(scn),
      climate: { city: clim.name, zone: clim.zone.code, pavHigh98: round(clim.pavHigh98, 1), pavLow98: round(clim.pavLow98, 1) },
      method: rule.method, sealant: pick, feasibleSealants: ok.map((s) => s.name),
      reason: `路表低温(98%) ${round(lowNeed, 1)}°C，要求低温拉伸试验温度不高于该值；路表高温 ${round(clim.pavHigh98, 1)}°C，软化点宜≥${round(highNeed, 0)}°C`,
      note: ok.length ? '' : '无完全满足的型号，按低温优先取最耐寒型，并建议夏季加强巡查',
    };
  }

  // ---------- 13. 监测反馈：贝叶斯偏差修正 ----------
  // obs: [{binderFamily, gradType, indicator, ratio}]  ratio = 实测/预测 (fatigue 用 lg 差值)
  function updateBias(state, obs, prior) {

    if (!Number.isFinite(prior.tau) || prior.tau<=0 || !Number.isFinite(prior.sigma) || prior.sigma<=0) throw new Error('反馈先验参数须为正数');
    if (!Array.isArray(obs) || obs.length>1000) throw new Error('反馈观测须为不超过1000项的数组');
    const st = JSON.parse(JSON.stringify(state || {}));
    for (const o of obs) {
      if (!['base','hard','sbs','rubber','hva'].includes(o.binderFamily) || !['dense','sma','ogfc'].includes(o.gradType) || !['ds','strain','tsr','fatigue'].includes(o.indicator) || !Number.isFinite(o.ratio) || (o.indicator!=='fatigue' && o.ratio<=0)) throw new Error('反馈字段无效，比值须为正数');
      const k = `${o.binderFamily}|${o.gradType}|${o.indicator}`;
      const y = o.indicator === 'fatigue' ? o.ratio : Math.log(o.ratio);
      const cur = st[k] || { mean: 0, var: prior.tau * prior.tau, n: 0 };
      if (!Number.isFinite(cur.mean) || !Number.isFinite(cur.var) || cur.var<=0 || !Number.isInteger(cur.n) || cur.n<0) throw new Error('反馈状态无效');
      const prec = 1 / cur.var + 1 / (prior.sigma * prior.sigma);
      const mean = (cur.mean / cur.var + y / (prior.sigma * prior.sigma)) / prec;
      st[k] = { mean, var: 1 / prec, n: cur.n + 1 };
    }
    return st;
  }

  return { KB, ENGINE_ID, RULES, IND, IND_NAME, IND_UNIT, DIMS, DIM_NAME, buildCand, shapley, predictMean, recommend, VALIDATION_SAMPLES, climateOf, normalizeScenario, tagScenario, similarity, sceneTargets, enumerate, evaluate, makeNoise, resolveBinder, predictMean, updateBias, describe, experienceBaseline, pgGradeHigh, pgGradeLow };
});

<script>/*
 * 数智选材 · 场景—材料—性能 关联图（浏览器与 Node 通用，零依赖）
 *
 * 由结构化知识库与推荐引擎的机理先验“导出”的有向图，用于回答
 * “哪些材料能提升某项性能、代价是什么、受哪些规则约束、哪些病害/交通把该指标目标拉高”。
 *
 * 边权不是实测数据：材料→指标 的 effect 来自引擎预测式，在参考配方
 * AC-13 + 70# 基质沥青 + 无助剂 上做单一组成替换得到（basis: 'mechanism-prior'）。

 */
(function (root, factory) {

  // 数值越小越好的指标（低温分级）

    warm: () => KB.additives.warm, rap: () => KB.additives.rap, fiber: () => KB.additives.fiber, agg: () => KB.aggregates,
  };

  function nid(cls, id) { return cls + ':' + id; }
  const round = (x, d) => { const k = Math.pow(10, d); return Math.round(x * k) / k; };

  function buildGraph() {

    IND.forEach((k) => addNode(nid('ind', k), 'indicator', IND_NAME[k], { unit: IND_UNIT[k], lowerBetter: !!LOWER_BETTER[k] }));

    for (const cls of Object.keys(CLASS_SRC)) {

        addNode(nid(cls, o.id), 'material', o.name, extra);

    }

    // 材料 → 指标：参考配方上做单一组成替换
    const refCand = E.buildCand(REF, 'limestone');
    const refMu = E.predictMean(refCand, null);
    const swapKey = { grad: 'grad', binder: 'binder', water: 'water', rut: 'rut', warm: 'warm', rap: 'rap', fiber: 'fiber', agg: 'agg' };
    for (const cls of Object.keys(CLASS_SRC)) {
      for (const o of CLASS_SRC[cls]()) {
        if (SKIP_OPT.has(o.id)) continue;
        const cand = Object.assign({}, refCand);
        cand[swapKey[cls]] = cls === 'binder' ? E.resolveBinder(o.id) : o;
        // 参考配方已含的组成：替换为自身，效应为 0，不建边
        if (cls === 'grad' && o.id === 'AC13') continue;
        if (cls === 'binder' && o.id === 'B70') continue;
        if (cls === 'agg' && o.id === 'limestone') continue;
        const mu = E.predictMean(cand, null);
        for (const k of IND) {
          const isDs = k === 'ds';
          const effect = isDs ? (mu.ds / refMu.ds - 1) * 100 : mu[k] - refMu[k];
          if (Math.abs(effect) < (isDs ? 0.05 : 1e-6)) continue;
          addEdge(nid(cls, o.id), nid('ind', k), 'affects', {
            effect: round(effect, isDs ? 1 : 3), unit: isDs ? '%' : IND_UNIT[k] === '%' ? '百分点' : IND_UNIT[k], mode: isDs ? 'relative' : 'absolute',
            benefit: round((LOWER_BETTER[k] ? -1 : 1) * effect, 3), basis: 'mechanism-prior',
          });
        }
      }
    }

    // 病害 → 指标目标
    const DRIVE_MAP = { ds: ['ds', 'multiply'], strain: ['strain', 'multiply'], pgLowExtra: ['pgLow', 'extra-cooling'], fatigue: ['fatigue', 'add'], tsr: ['tsr', 'add'], td: ['td', 'target'] };
    for (const d of KB.distresses) {
      addNode(nid('dis', d.id), 'distress', d.name);
      for (const [key, arr] of Object.entries(d.drives || {})) {
        const m = DRIVE_MAP[key]; if (!m) continue;
        addEdge(nid('dis', d.id), nid('ind', m[0]), 'drives', { bySeverity: arr.slice(), mode: m[1], basis: 'ENG' });
      }
    }
    // 交通与车速 → 指标目标
    for (const t of KB.traffic.levels) {
      addNode(nid('trf', t.id), 'scenario', '交通：' + t.name);
      addEdge(nid('trf', t.id), nid('ind', 'fatigue'), 'raises', { value: t.fatigueTarget, mode: 'target', basis: 'ENG' });
      if (t.dsFactor != null) addEdge(nid('trf', t.id), nid('ind', 'ds'), 'raises', { value: t.dsFactor, mode: 'multiply', basis: 'ENG' });
      if (t.pgBump) addEdge(nid('trf', t.id), nid('ind', 'pgHigh'), 'raises', { value: t.pgBump, mode: 'grade-bump', basis: 'ENG' });
    }
    for (const sp of KB.traffic.speed) {
      addNode(nid('spd', sp.id), 'scenario', '车速：' + sp.name);
      if (sp.dsFactor !== 1) addEdge(nid('spd', sp.id), nid('ind', 'ds'), 'raises', { value: sp.dsFactor, mode: 'multiply', basis: 'ENG' });
      if (sp.pgBump) addEdge(nid('spd', sp.id), nid('ind', 'pgHigh'), 'raises', { value: sp.pgBump, mode: 'grade-bump', basis: 'ENG' });
    }
    for (const t of KB.treatments) addNode(nid('trt', t.id), 'scenario', '工法：' + t.name);

    // 规则 → 材料
    const resolveInvolved = (ref) => {
      const [kind, val] = ref.split(':');
      if (kind === 'grad') {
        if (['sma', 'ogfc', 'dense'].includes(val)) return KB.gradations.filter((g) => g.type === val).map((g) => nid('grad', g.id));
        return nodes.has(nid('grad', val)) ? [nid('grad', val)] : [];
      }
      if (kind === 'binder') {
        if (val === 'modified') return KB.binders.filter((b) => b.modified).map((b) => nid('binder', b.id));
        return nodes.has(nid('binder', val)) ? [nid('binder', val)] : [];
      }
      if (['rap', 'rut', 'water', 'fiber', 'agg'].includes(kind)) return nodes.has(nid(kind, val)) ? [nid(kind, val)] : [];
      if (kind === 'speed') return nodes.has(nid('spd', val)) ? [nid('spd', val)] : [];
      return [];
    };
    for (const r of E.RULES) {
      addNode('rule:' + r.key, 'rule', r.text);
      const hit = new Set();
      r.involves.forEach((x) => resolveInvolved(x).forEach((id) => hit.add(id)));
      hit.forEach((id) => addEdge('rule:' + r.key, id, 'restricts', { basis: 'ENG' }));
    }

    return { meta: { reference: REF, basis: '由结构化知识库与机理先验导出，不是实测知识图谱', nodes: nodes.size, edges: edges.length }, nodes: Array.from(nodes.values()), edges };
  }

  // ---------- 查询 ----------
  function neighbors(g, id, opts) {
    opts = opts || {};
    const dir = opts.dir || 'both';
    return g.edges.filter((e) => (!opts.rel || e.rel === opts.rel) && ((dir !== 'in' && e.from === id) || (dir !== 'out' && e.to === id)));
  }
  const nodeOf = (g, id) => g.nodes.find((n) => n.id === id);

  // 哪些材料能改善某项指标，以及改善它要付出哪些其他指标上的代价
  function improvers(g, indicator, opts) {
    opts = opts || {};
    const top = opts.top || 8;
    if (!IND.includes(indicator)) throw new Error('未知指标 ' + indicator);
    const items = [];
    for (const e of g.edges) {
      if (e.rel !== 'affects' || e.to !== nid('ind', indicator) || e.benefit <= 0) continue;
      const n = nodeOf(g, e.from);
      if (opts.cls && n.cls !== opts.cls) continue;
      const tradeoffs = g.edges.filter((x) => x.rel === 'affects' && x.from === e.from && x.to !== e.to && x.benefit < 0)
        .map((x) => ({ indicator: x.to.slice(4), name: IND_NAME[x.to.slice(4)], effect: x.effect, unit: x.unit }));
      items.push({
        id: n.id, name: n.name, cls: n.cls, className: n.className, effect: e.effect, unit: e.unit, benefit: e.benefit, tradeoffs,
        restrictedBy: neighbors(g, n.id, { rel: 'restricts', dir: 'in' }).map((x) => x.from.slice(5)),
      });
    }
    // 不同指标量纲不同，仅在同一指标内按收益排序
    return items.sort((a, b) => b.benefit - a.benefit).slice(0, top);
  }

  // 一个材料节点的全部影响
  function profile(g, id) {
    const n = nodeOf(g, id); if (!n) throw new Error('图中无节点 ' + id);
    const eff = neighbors(g, id, { rel: 'affects', dir: 'out' }).map((e) => ({
      indicator: e.to.slice(4), name: IND_NAME[e.to.slice(4)], effect: e.effect, unit: e.unit, better: e.benefit > 0,
    }));
    return {
      node: n, improves: eff.filter((x) => x.better), worsens: eff.filter((x) => !x.better),
      restrictedBy: neighbors(g, id, { rel: 'restricts', dir: 'in' }).map((x) => ({ rule: x.from.slice(5), text: nodeOf(g, x.from).name })),
    };
  }

  // 哪些场景因素会抬高某指标的目标
  function drivers(g, indicator) {
    if (!IND.includes(indicator)) throw new Error('未知指标 ' + indicator);
    return g.edges.filter((e) => (e.rel === 'drives' || e.rel === 'raises') && e.to === nid('ind', indicator))
      .map((e) => Object.assign({ source: nodeOf(g, e.from).name, sourceId: e.from, rel: e.rel }, e.bySeverity ? { bySeverity: e.bySeverity } : { value: e.value }, { mode: e.mode }));
  }

  let cached = null;
  return { buildGraph, graph: () => cached || (cached = buildGraph()), neighbors, improvers, profile, drivers, REF };
});
</script>

<script>
(function(){
'use strict';
const E = window.SZXC, G = window.SZXC_GRAPH, KB = E.KB, CASES = window.SZXC_CASES;
const $ = (id) => document.getElementById(id);
const fmt = (x, d=2) => (x==null||isNaN(x)) ? '—' : Number(x).toFixed(d);
const pct = (x) => (x*100).toFixed(1) + '%';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let biasState = {}; let last = null; let lastInput = null; let selectedId = null; let currentCase = null;

// ---------- 主题 ----------
try { const t = localStorage.getItem('szxc-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
$('themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx;
  try { localStorage.setItem('szxc-theme', nx); } catch(e) {}
  if (last) render(last);
};

opt($('city'), KB.cities, (c) => `${c.name}（${E.climateOf({cityId:c.id}).zone.code}）`);

opt($('traffic'), KB.traffic.levels, (t) => `${t.name}（${t.esal}）`);
opt($('speed'), KB.traffic.speed, (t) => t.name);

  $('targetRel').value = s.targetReliability ?? ''; $('budget').value = s.budgetPerM2 ?? ''; $('crackW').value = s.crackWidthMm ?? 8;

function readForm() {

    speed: $('speed').value, aggregate: $('aggregate').value, ambientT: +$('ambientT').value, haulMin: +$('haulMin').value, nightWork: $('nightWork').checked,

  if ($('targetRel').value) s.targetReliability = +$('targetRel').value;

function runNow() {

  setTimeout(() => {

    catch (e) { last = null; selectedId = null; $('out').innerHTML = `<div class="empty" role="alert">出错：${esc(e.message)}</div>`; }

$('exportBtn').onclick = () => {

  const a = document.createElement('a');

  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
};

// ---------- 渲染 ----------
function render(o) {
  if (o.module === 'crack') return renderCrack(o);
  if (o.module === 'infeasible') {
    $('out').innerHTML = `<div class="empty">${esc(o.reason)}<br>规则筛选后 ${o.stats.feasible} 个候选，预算剔除 ${o.stats.budgetCut} 个，碳排上限剔除 ${o.stats.carbonCut || 0} 个。</div>`;
    return;
  }
  const r = o.recommended;
  const sim = CASES.map((c) => ({ c, s: E.similarity(o.tags, E.tagScenario(c.input)) })).sort((a,b) => b.s - a.s).slice(0, 3);
  const v = r.validation;
  $('out').innerHTML = `
  <h2><span class="n">02</span>结论 <span class="hint">${o.climate.city} · ${o.climate.zone} ${o.climate.zoneName} · 候选 ${o.stats.feasible}/${o.stats.enumerated} · ${o.elapsedMs} ms</span></h2>
  <div class="verdict">
    <div class="big">${esc(r.label)}</div>
    <span class="k">模型内联合通过比例</span><span class="v">${pct(r.reliability)}　目标 ${pct(o.targetReliability)}　${o.targetReached ? '<span class="pill ok">模型内达成</span>' : '<span class="pill no">模型内未达目标，须人工复核</span>'}</span>
    <span class="k">95%抽样区间</span><span class="v">${r.reliabilityInterval95.map(pct).join('–')}（${r.samples}次抽样，仅含抽样误差，不含模型与先验误差）</span>
    <span class="k">独立种子复验</span><span class="v">${pct(v.reliability)}（${v.reliabilityInterval95.map(pct).join('–')}，${v.samples}次）${v.meetsTargetPoint ? '<span class="pill ok">复验仍达标</span>' : '<span class="pill no">复验未达标</span>'}　选优时 ${pct(r.reliability)}，偏差 ${(v.selectionGap*100).toFixed(1)} pt${o.selection.mode === 'validated' ? '（已按独立噪声复算 ' + o.selection.validatedCandidates + ' 个候选后选优）' : ''}</span>
    <span class="k">最可能先出问题的指标</span><span class="v">${esc(r.bottleneckName)}（单项达标 ${pct(r.passRate[r.bottleneck])}）</span>
    <span class="k">场景所需结合料等级(98%)</span><span class="v">${o.climate.pgRequired98}；所选结合料 ${r.formula.binderPG}</span>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="k">模型估计寿命</div><div class="v">${fmt(r.lifeMean,1)}<small> 年（P10 ${fmt(r.lifeP10,1)}）</small></div></div>
    <div class="kpi"><div class="k">初始造价</div><div class="v">${fmt(r.costM2,1)}<small> 元/m²</small></div></div>
    <div class="kpi"><div class="k">等额年值成本</div><div class="v">${fmt(r.euac,2)}<small> 元/m²·年</small></div></div>
    <div class="kpi"><div class="k">年均碳排</div><div class="v">${fmt(r.carbonYr,2)}<small> kgCO₂e/m²·年</small></div></div>
  </div>

  <h2><span class="n">03</span>需求包络：这个场景要什么，依据是什么</h2>
  <table><thead><tr><th>性能指标</th><th style="text-align:right">场景目标</th><th style="text-align:right">所选方案预测</th><th>达标概率</th><th>依据</th></tr></thead><tbody>
  ${o.requirements.map((q) => { const p = r.predicted[q.ind]; const pr = r.passRate[q.ind];
    const reqShow = q.ind==='pgHigh'||q.ind==='pgLow' ? q.sceneTarget : (p.req ?? q.sceneTarget);
    return `<tr><td>${q.name}</td><td class="num">${q.ind==='pgLow'?'≤ ':'≥ '}${fmt(reqShow, q.ind==='ds'||q.ind==='strain'?0:q.ind==='td'?2:1)} ${q.unit}</td><td class="num">${fmt(p.mean, q.ind==='ds'||q.ind==='strain'?0:q.ind==='td'?2:1)}</td>
    <td><div class="bar" title="${pct(pr)}"><i class="${pr < o.targetReliability ? 'low':''}" style="width:${pr*100}%"></i><b style="left:${o.targetReliability*100}%"></b></div></td>
    <td class="why">${p.binding==='std' ? '<span class="tag std">规范底线</span>' : '<span class="tag scene">场景驱动</span>'} ${esc(q.why)}</td></tr>`; }).join('')}
  </tbody></table>
  <div class="note">PG 两行的目标是年均气候下的中值，达标概率按气候年际波动抽样计算；黄色竖线为目标可靠度。</div>

  <h2><span class="n">04</span>方案空间 <span class="hint">点击任一点查看该方案</span></h2>
  <div class="grid2">
    <div class="chartbox" id="chart"><div class="tip" id="tip"></div></div>
    <div>
      <div class="formula" id="formula"></div>
      <div class="note" style="margin-top:8px">优先级（按稀缺度：可行方案中多少比例难以满足该项）</div>
      <table style="margin-top:4px"><tbody>${o.priorities.slice(0,5).map((p,i) => `<tr><td style="width:24px" class="num">${i+1}</td><td>${p.name}</td><td style="width:45%"><div class="bar"><i style="width:${p.scarcity*100}%"></i></div></td></tr>`).join('')}</tbody></table>
    </div>
  </div>

  <h2><span class="n">08</span>材料—工艺协同</h2>

    <tr><td>若现场空隙率比设计大 1%</td><td class="num ${o.process.robustness.va1<0?'neg':''}">${(o.process.robustness.va1*100).toFixed(1)} pt</td><td class="why">可靠度变化：数值越接近 0，施工容错越高</td></tr>

  drawChart(o);

  $('fbBtn').onclick = () => {
    const obs = Array.from({length:10}, () => ({ binderFamily: $('fbFam').value, gradType: $('fbGrad').value, indicator: $('fbInd').value, ratio: +$('fbRatio').value }));

}

function drawChart(o) {
  const box = $('chart'), W = Math.max(320, box.clientWidth - 16), H = 300, m = {l:46, r:12, t:12, b:36};
  const css = getComputedStyle(document.documentElement);
  const C = (v) => css.getPropertyValue(v).trim();
  // 横轴只覆盖“有意义”的方案（可靠度≥10%），超出部分贴边绘制
  const pts = o.cloud; const xs = pts.map((p) => p[1]);
  const xsUseful = pts.filter((p) => p[0] >= 0.1).map((p) => p[1]).concat([o.baselines.experience.euac, o.recommended.euac]);
  const x0 = Math.min(...xs) - 0.2, x1 = Math.max(x0 + 1, Math.max(...xsUseful) * 1.04);
  const X = (v) => m.l + (Math.min(v, x1) - x0) / (x1 - x0) * (W - m.l - m.r);
  const Y = (v) => m.t + (1 - v) * (H - m.t - m.b);
  const front = new Set(o.pareto.map((p) => p.id));
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="可靠度与年值成本散点图">`;
  for (let g = 0; g <= 1.0001; g += 0.25) s += `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(g)}" y2="${Y(g)}" stroke="${C('--rule')}"/><text x="${m.l-6}" y="${Y(g)+4}" text-anchor="end">${(g*100).toFixed(0)}%</text>`;
  const step = niceStep((x1 - x0) / 5);
  for (let v = Math.ceil(x0/step)*step; v <= x1; v += step) s += `<text x="${X(v)}" y="${H-m.b+16}" text-anchor="middle">${v.toFixed(step<1?1:0)}</text>`;
  s += `<text x="${(W+m.l)/2}" y="${H-4}" text-anchor="middle">等额年值成本 元/(m²·年) →</text>`;
  s += `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(o.targetReliability)}" y2="${Y(o.targetReliability)}" stroke="${C('--accent')}" stroke-dasharray="5 4" stroke-width="1.5"/>`;
  s += `<text x="${W-m.r-2}" y="${Y(o.targetReliability)-4}" text-anchor="end" style="fill:${C('--accent-ink')}">目标可靠度</text>`;
  for (const p of pts) if (!front.has(p[3])) s += `<circle cx="${X(p[1]).toFixed(1)}" cy="${Y(p[0]).toFixed(1)}" r="2.2" fill="${C('--dot')}" data-id="${p[3]}"/>`;
  for (const p of pts) if (front.has(p[3])) s += `<circle cx="${X(p[1]).toFixed(1)}" cy="${Y(p[0]).toFixed(1)}" r="3.6" fill="${C('--front')}" data-id="${p[3]}"/>`;
  const ex = o.baselines.experience; s += `<rect x="${X(ex.euac)-5}" y="${Y(ex.reliability)-5}" width="10" height="10" fill="none" stroke="${C('--warn')}" stroke-width="2" data-id="${ex.id}"/>`;
  const r = o.recommended; s += `<rect x="${X(r.euac)-6}" y="${Y(r.reliability)-6}" width="12" height="12" fill="${C('--accent')}" stroke="${C('--ink')}" transform="rotate(45 ${X(r.euac)} ${Y(r.reliability)})" data-id="${r.id}"/>`;
  s += `</svg>`;
  box.insertAdjacentHTML('beforeend', s);
  const tip = $('tip'), byId = new Map(pts.map((p) => [p[3], p]));
  box.querySelector('svg').addEventListener('mousemove', (e) => {
    const id = e.target.dataset && e.target.dataset.id; if (!id) { tip.style.display = 'none'; return; }
    const p = byId.get(id) || [ex.reliability, ex.euac, ex.carbonYr, id];
    tip.innerHTML = `${esc(labelOf(id))}<br>可靠度 ${pct(p[0])} · 年值 ${fmt(p[1])} · 碳 ${fmt(p[2])}`;
    const bb = box.getBoundingClientRect(); tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX - bb.left + 12, bb.width - 300) + 'px'; tip.style.top = (e.clientY - bb.top + 12) + 'px';
  });
  box.querySelector('svg').addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  box.querySelector('svg').addEventListener('click', (e) => { const id = e.target.dataset && e.target.dataset.id; if (id) { selectedId = id; showFormula(o, id); } });
}
function drawRadar(o) {
  const box = $('radar'), R = o.radar, n = R.axes.length;
  const W = Math.max(300, Math.min(520, box.clientWidth - 16)), H = Math.round(W * 0.92), cx = W / 2, cy = H / 2 + 6, rad = Math.min(W, H) / 2 - 54;
  const css = getComputedStyle(document.documentElement), C = (v) => css.getPropertyValue(v).trim();
  const ang = (i) => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, v) => [cx + Math.cos(ang(i)) * rad * v, cy + Math.sin(ang(i)) * rad * v];
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="多维对比雷达图，数据见右侧表格">`;
  for (const g of [0.25, 0.5, 0.75, 1]) s += `<polygon points="${R.axes.map((_, i) => pt(i, g).join(',')).join(' ')}" fill="none" stroke="${C('--rule')}"/>`;
  R.axes.forEach((a, i) => { const [x, y] = pt(i, 1), [lx, ly] = pt(i, 1.17); s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${C('--rule')}"/><text x="${lx}" y="${ly + 4}" text-anchor="${Math.abs(lx - cx) < 6 ? 'middle' : lx > cx ? 'start' : 'end'}">${esc(a.name)}</text>`; });
  const style = (se, k) => se.role === 'recommended' ? { stroke: C('--ink'), fill: C('--accent'), fo: 0.35, w: 2.2, d: '' }
    : se.role === 'experience' ? { stroke: C('--warn'), fill: 'none', fo: 0, w: 2, d: '6 4' } : { stroke: C('--dot'), fill: 'none', fo: 0, w: 1.2, d: '' };
  R.series.slice().reverse().forEach((se) => { const st = style(se); s += `<polygon points="${se.values.map((v, i) => pt(i, v).join(',')).join(' ')}" fill="${st.fill}" fill-opacity="${st.fo}" stroke="${st.stroke}" stroke-width="${st.w}" ${st.d ? `stroke-dasharray="${st.d}"` : ''}><title>${esc(se.label)}</title></polygon>`; });
  s += '</svg>';
  box.innerHTML = s + `<div class="rlegend"><span style="--sw:${C('--ink')}">推荐</span><span style="--sw:${C('--dot')}">备选（Pareto）</span><span class="dash" style="--sw:${C('--warn')}">经验选型</span></div>`;
  const names = R.series.map((se, i) => se.role === 'recommended' ? '推荐' : se.role === 'experience' ? '经验' : '备选' + i);
  $('radarSide').innerHTML = `<table aria-label="雷达图数据"><thead><tr><th>维度</th>${names.map((x) => `<th style="text-align:right">${x}</th>`).join('')}</tr></thead><tbody>${R.axes.map((a, i) => `<tr><td>${esc(a.name)}</td>${R.series.map((se) => `<td class="num">${(se.values[i] * 100).toFixed(0)}</td>`).join('')}</tr>`).join('')}</tbody></table>
  <div class="note" style="margin-top:6px">${esc(R.note)}</div>
  <div class="note" style="margin-top:6px">${R.series.map((se, i) => esc(names[i] + '：' + se.label)).join('<br>')}</div>`;
}
function initExplain(o) {
  const ex = o.explain, def = ex.indicators.some((x) => x.ind === o.recommended.bottleneck) ? o.recommended.bottleneck : 'ds';
  $('exNote').textContent = ex.note + ' 参考配方：' + ex.reference.label + '。';
  const show = (ind) => {
    document.querySelectorAll('#exTabs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.ind === ind)));
    const x = ex.indicators.find((q) => q.ind === ind), log = x.scale === 'log';
    const eff = (c) => log ? (c.factor - 1) * 100 : c.value;
    const max = Math.max(1e-9, ...x.contributions.map((c) => Math.abs(eff(c))));
    const dec = ind === 'td' || ind === 'fatigue' ? 3 : 1;
    const unit = log ? '%' : (x.unit === '%' ? ' 百分点' : ' ' + x.unit);
    $('exBody').innerHTML = `<div class="note" style="margin-bottom:4px">${esc(x.name)}：参考配方 ${fmt(x.reference, ind==='ds'||ind==='strain'?0:dec)} → 所选方案 ${fmt(x.predicted, ind==='ds'||ind==='strain'?0:dec)} ${esc(x.unit)}。各组成的贡献相加等于总变化${log ? '（在对数空间相加，下表为乘性影响）' : ''}。</div>
    <div class="contrib">${x.contributions.map((c) => { const v = eff(c), w = Math.abs(v) / max * 50;
      return `<div>${esc(c.dimName)}<div class="note">${esc(c.from)} → ${esc(c.to)}</div></div><div class="cbar"><i class="${v >= 0 ? 'p' : 'n'}" style="${v >= 0 ? 'left:50%' : 'right:50%'};width:${w}%"></i></div><div class="num" style="text-align:right;font-family:var(--mono)">${v >= 0 ? '+' : ''}${v.toFixed(dec)}${unit}</div>`; }).join('') || '<div>与参考配方一致，无差异</div>'}</div>`;
  };
  $('exTabs').innerHTML = ex.indicators.map((x) => `<button type="button" data-ind="${x.ind}" aria-pressed="false">${esc(x.name.split(' ')[0])}</button>`).join('');
  $('exTabs').onclick = (e) => { const b = e.target.closest('[data-ind]'); if (b) show(b.dataset.ind); };
  show(def);
}
function initGraph() {
  const g = G.graph();
  const run = () => {
    const ind = $('gInd').value, items = G.improvers(g, ind, { top: 8, cls: $('gCls').value || undefined });
    const unitOf = (x) => x.unit;
    $('gOut').innerHTML = items.length ? `<table><thead><tr><th>材料</th><th style="text-align:right">对该指标的效应</th><th>同时带来的代价</th><th>受哪些规则约束</th></tr></thead><tbody>${items.map((x) => `<tr data-node="${esc(x.id)}" style="cursor:pointer"><td>${esc(x.name)} <span class="tag">${esc(x.className)}</span></td><td class="num pos">${x.effect >= 0 ? '+' : ''}${x.effect} ${esc(unitOf(x))}</td><td class="why">${x.tradeoffs.map((t) => `${esc(t.name.split(' ')[0])} ${t.effect >= 0 ? '+' : ''}${t.effect}${esc(t.unit)}`).join('；') || '—'}</td><td class="why">${x.restrictedBy.join('、') || '—'}</td></tr>`).join('')}</tbody></table>
      <div class="note" style="margin-top:4px">效应为参考配方（AC-13 + 70# + 无助剂）上单一组成替换的预测差异；规则编号见下方展开。点击一行查看该材料的全部影响。</div><div id="gProfile"></div>`
      : '<div class="empty">当前指标下没有可提升它的材料。</div>';
  };
  $('gInd').onchange = run; $('gCls').onchange = run;
  $('gOut').onclick = (e) => {
    const tr = e.target.closest('[data-node]'); if (!tr) return;
    const pr = G.profile(g, tr.dataset.node), f = (x) => `${esc(x.name.split(' ')[0])} ${x.effect >= 0 ? '+' : ''}${x.effect}${esc(x.unit)}`;
    $('gProfile').innerHTML = `<details class="gnode" open><summary>${esc(pr.node.name)}：全部影响与约束</summary>
      <div>改善：${pr.improves.map(f).join('；') || '—'}</div><div>变差：${pr.worsens.map(f).join('；') || '—'}</div>
      <div>规则：${pr.restrictedBy.map((r) => esc(r.text)).join('；') || '无'}</div></details>`;
  };
  run();
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x))); const f = x / p; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p; }
function labelOf(id) {
  const [g, b, w, r, wm, rap, f] = id.split('/'), A = KB.additives, by = (a, i) => a.find((x) => x.id === i);
  const parts = [by(KB.gradations, g).name, E.resolveBinder(b).name];
  if (w !== 'none') parts.push(by(A.water, w).name); if (r !== 'none') parts.push(by(A.rut, r).name);
  if (wm !== 'none') parts.push(by(A.warm, wm).name); if (rap !== 'R0') parts.push(by(A.rap, rap).name); if (f !== 'none') parts.push(by(A.fiber, f).name);
  return parts.join(' + ');
}
function showFormula(o, id) {
  const r = o.recommended, isRec = id === r.id;
  const p = o.cloud.find((x) => x[3] === id);
  const [g, b, w, rut, wm, rap, f] = id.split('/'), A = KB.additives, by = (a, i) => a.find((x) => x.id === i);
  const bd = E.resolveBinder(b), gd = by(KB.gradations, g);
  $('formula').innerHTML = `<div style="margin-bottom:6px">${isRec ? '<span class="pill ok">推荐方案</span>' : '<span class="pill">所选方案</span>'} ${isRec ? '' : `可靠度 ${pct(p[0])} · 年值 ${fmt(p[1])}`}</div>
    <b>级配</b>${gd.name}（油石比约 ${gd.pb}%，设计空隙率 ${gd.va}%）<br>
    <b>结合料</b>${bd.name}，约 PG ${E.pgGradeHigh(bd.trueHigh)}-${-E.pgGradeLow(bd.trueLow)}<br>
    <b>集料</b>${by(KB.aggregates, o.scenario.aggregate).name}<br>
    <b>抗水损</b>${by(A.water, w).name}<br><b>抗车辙</b>${by(A.rut, rut).name}<br>
    <b>拌和</b>${by(A.warm, wm).name}<br><b>RAP</b>${by(A.rap, rap).name}<br><b>纤维</b>${by(A.fiber, f).name}`;
}
function renderCrack(o) {

  <h2><span class="n">02</span>结论 <span class="hint">${o.climate.city} · ${o.climate.zone}</span></h2>

  <p class="note">${esc(o.note || '裂缝处治模块按路表温度包络筛选灌缝材料型号，再按缝宽确定工艺。')}</p>`;
}

loadCase((CASES.find((c) => "#" + c.id === location.hash) || CASES[0]).id, true);
})();
